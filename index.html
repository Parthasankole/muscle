<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuscleMap — Precision Training Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--bg2:#111318;--bg3:#181c24;--bg4:#1e2330;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);--text:#e8eaf0;--muted:#7a8099;--cyan:#00d4c8;--cyan2:#00a89e;--red:#ff4757;--gold:#f5a623;--green:#2ecc71;--muscle-idle:rgba(50,70,130,0.45);--muscle-hover:rgba(0,212,200,0.55);--muscle-active:rgba(255,71,87,0.85);--muscle-stroke:rgba(0,212,200,0.28);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,11,13,0.93);backdrop-filter:blur(20px);border-bottom:0.5px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:4px;color:var(--cyan);}
.logo span{color:var(--red);}
.header-right{display:flex;align-items:center;gap:1rem;}
.sel-count{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--cyan);background:rgba(0,212,200,0.08);border:0.5px solid rgba(0,212,200,0.25);padding:4px 10px;border-radius:4px;}
.clear-btn{background:transparent;border:0.5px solid var(--border2);color:var(--muted);padding:6px 14px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.8rem;cursor:pointer;transition:all 0.2s;letter-spacing:1px;}
.clear-btn:hover{border-color:var(--red);color:var(--red);}
.gender-wrap{padding-top:60px;display:flex;justify-content:center;position:sticky;top:60px;z-index:90;background:var(--bg);border-bottom:0.5px solid var(--border);}
.gender-btn{flex:0 0 160px;padding:14px 0;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;transition:all 0.25s;}
.gender-btn.am{color:var(--cyan);border-bottom-color:var(--cyan);}
.gender-btn.af{color:var(--red);border-bottom-color:var(--red);}
.gender-btn:hover{color:var(--text);}
.main{display:grid;grid-template-columns:1fr 420px;min-height:calc(100vh - 122px);max-width:1380px;margin:0 auto;padding:2rem 1.5rem;gap:2rem;}
.anatomy-panel{position:sticky;top:122px;align-self:start;background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:1.5rem;overflow:hidden;}
.panel-label{font-family:'JetBrains Mono',monospace;font-size:0.63rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:.8rem;}
.hint-text{font-size:0.74rem;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:6px;}
.hint-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);display:inline-block;flex-shrink:0;}
.view-toggle{display:flex;gap:8px;margin-bottom:1rem;}
.view-btn{padding:5px 14px;border-radius:20px;font-size:0.73rem;cursor:pointer;border:0.5px solid var(--border2);background:transparent;color:var(--muted);transition:all 0.2s;font-family:'DM Sans',sans-serif;}
.view-btn.active{background:var(--bg4);color:var(--text);border-color:rgba(255,255,255,0.25);}
.svg-container{width:100%;display:flex;justify-content:center;}
.anatomy-svg{width:100%;max-width:400px;cursor:default;}
.muscle-group{cursor:pointer;}
.muscle-group path,.muscle-group ellipse,.muscle-group circle,.muscle-group polygon,.muscle-group rect{fill:var(--muscle-idle);stroke:var(--muscle-stroke);stroke-width:0.6;transition:fill 0.18s,stroke 0.18s;}
.muscle-group:hover path,.muscle-group:hover ellipse,.muscle-group:hover circle,.muscle-group:hover polygon,.muscle-group:hover rect{fill:var(--muscle-hover);stroke:var(--cyan);stroke-width:1.1;}
.muscle-group.selected path,.muscle-group.selected ellipse,.muscle-group.selected circle,.muscle-group.selected polygon,.muscle-group.selected rect{fill:var(--muscle-active);stroke:var(--red);stroke-width:1.3;}
.body-base{fill:#182040;stroke:rgba(255,255,255,0.09);stroke-width:1;}
.label-line{stroke:rgba(255,255,255,0.18);stroke-width:0.5;}
.muscle-label{font-family:'JetBrains Mono',monospace;font-size:7px;fill:rgba(255,255,255,0.4);pointer-events:none;}
.tags-area{display:flex;flex-wrap:wrap;gap:6px;margin-top:1rem;min-height:24px;}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,71,87,0.12);border:0.5px solid rgba(255,71,87,0.38);border-radius:4px;padding:3px 9px;font-size:0.72rem;color:var(--red);font-family:'JetBrains Mono',monospace;}
.tag button{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;line-height:1;padding:0;}
.exercise-panel{min-height:600px;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem;text-align:center;color:var(--muted);border:1px dashed var(--border2);border-radius:16px;min-height:380px;}
.empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.25;}
.empty-state h3{font-size:1rem;font-weight:400;margin-bottom:.5rem;}
.empty-state p{font-size:0.78rem;max-width:220px;line-height:1.6;}
.ex-type-toggle{display:flex;gap:8px;margin-bottom:1.4rem;}
.ex-type-btn{flex:1;padding:10px;text-align:center;font-size:0.8rem;cursor:pointer;border-radius:8px;border:0.5px solid var(--border2);background:transparent;color:var(--muted);transition:all 0.22s;font-family:'DM Sans',sans-serif;font-weight:500;letter-spacing:.5px;}
.ex-type-btn.active{background:var(--bg4);color:var(--text);border-color:var(--cyan);}
.exercise-cards{display:flex;flex-direction:column;gap:.9rem;}
.ex-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.2s,transform 0.15s;}
.ex-card:hover{border-color:var(--border2);transform:translateY(-1px);}
.ex-card.open{border-color:var(--cyan2);}
.ex-card-header{display:flex;align-items:center;gap:1rem;padding:.95rem 1.1rem;}
.ex-num{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--border2);min-width:28px;line-height:1;transition:color 0.2s;}
.ex-card.open .ex-num{color:var(--cyan);}
.ex-info{flex:1;}
.ex-name{font-weight:600;font-size:.93rem;margin-bottom:3px;transition:color 0.2s;}
.ex-card.open .ex-name{color:var(--cyan);}
.ex-meta{display:flex;gap:7px;flex-wrap:wrap;}
.ex-badge{font-size:0.62rem;padding:2px 7px;border-radius:3px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.5px;}
.badge-bw{background:rgba(46,204,113,0.1);color:var(--green);border:0.5px solid rgba(46,204,113,0.28);}
.badge-gym{background:rgba(245,166,35,0.1);color:var(--gold);border:0.5px solid rgba(245,166,35,0.28);}
.badge-primary{background:rgba(255,71,87,0.09);color:var(--red);border:0.5px solid rgba(255,71,87,0.22);}
.ex-chevron{color:var(--muted);font-size:.9rem;transition:transform 0.25s;}
.ex-card.open .ex-chevron{transform:rotate(180deg);color:var(--cyan);}
.ex-detail{max-height:0;overflow:hidden;transition:max-height 0.4s ease;border-top:0.5px solid transparent;}
.ex-card.open .ex-detail{max-height:1400px;border-top-color:var(--border);}
.ex-detail-inner{padding:1.1rem;}
.sets-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.9rem;}
.sets-item{background:var(--bg4);border-radius:6px;padding:8px;text-align:center;}
.sets-label{font-size:0.62rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;}
.sets-val{font-family:'JetBrains Mono',monospace;font-size:0.88rem;color:var(--text);}
.steps-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem;}
.step-card{background:var(--bg3);border-radius:7px;padding:.8rem;border:0.5px solid var(--border);}
.step-num{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--cyan);letter-spacing:1px;margin-bottom:5px;}
.step-text{font-size:0.78rem;color:var(--muted);line-height:1.6;}
.step-text strong{color:var(--text);font-weight:500;}
.muscles-hit{font-size:0.73rem;color:var(--muted);}
.muscles-hit span{color:var(--cyan);font-weight:500;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--text);margin-bottom:1.1rem;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:0.5px;background:var(--border);}
#tooltip{position:fixed;z-index:999;background:var(--bg4);border:0.5px solid var(--border2);border-radius:5px;padding:5px 11px;font-size:0.72rem;color:var(--text);font-family:'JetBrains Mono',monospace;pointer-events:none;opacity:0;transition:opacity 0.15s;white-space:nowrap;}
@keyframes pulseRed{0%,100%{filter:drop-shadow(0 0 2px rgba(255,71,87,.3));}50%{filter:drop-shadow(0 0 7px rgba(255,71,87,.85));}}
.muscle-group.selected{animation:pulseRed 2.2s ease infinite;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.ex-card{animation:fadeUp 0.3s ease both;}
@media(max-width:860px){.main{grid-template-columns:1fr;}.anatomy-panel{position:static;}}
</style>
</head>
<body>
<div id="tooltip"></div>
<header>
  <div class="logo">Muscle<span>Map</span></div>
  <div class="header-right">
    <div class="sel-count" id="selCount">0 MUSCLES</div>
    <button class="clear-btn" onclick="clearAll()">CLEAR</button>
  </div>
</header>
<div class="gender-wrap">
  <button class="gender-btn am" id="btnMale" onclick="setGender('male')">&#9794; MALE</button>
  <button class="gender-btn" id="btnFemale" onclick="setGender('female')">&#9792; FEMALE</button>
</div>
<div class="main">
  <div class="anatomy-panel">
    <div class="panel-label">// ANATOMICAL ATLAS</div>
    <div class="hint-text"><span class="hint-dot"></span> Click muscle groups to load exercises. Multi-select supported.</div>
    <div class="view-toggle">
      <button class="view-btn active" id="btnFront" onclick="setView('front')">ANTERIOR</button>
      <button class="view-btn" id="btnBack" onclick="setView('back')">POSTERIOR</button>
    </div>
    <div class="svg-container" id="svgContainer"></div>
    <div class="tags-area" id="tagsArea"></div>
  </div>
  <div class="exercise-panel" id="exercisePanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">&#9711;</div>
      <h3>No muscles selected</h3>
      <p>Click on any muscle in the anatomy diagram to load targeted exercises</p>
    </div>
    <div id="exerciseContent" style="display:none">
      <div class="section-title" id="exTitle">EXERCISES</div>
      <div class="ex-type-toggle">
        <button class="ex-type-btn active" id="bwBtn" onclick="setExType('bodyweight')">&#9649; BODYWEIGHT</button>
        <button class="ex-type-btn" id="gymBtn" onclick="setExType('gym')">&#9640; GYM / WEIGHTS</button>
      </div>
      <div class="exercise-cards" id="exerciseCards"></div>
    </div>
  </div>
</div>
<script>
const MUSCLE_NAMES={chest:"Pectoralis Major",biceps:"Biceps Brachii",triceps:"Triceps Brachii",shoulders:"Deltoids",back:"Lats / Back",abs:"Abdominals",quads:"Quadriceps",hamstrings:"Hamstrings",glutes:"Gluteus Maximus",calves:"Gastrocnemius",traps:"Trapezius",forearms:"Forearms"};

const EX={
chest:{
bodyweight:[
{name:"Push-Up",primary:"Pectoralis Major",sets:"3-4",reps:"10-20",rest:"60s",steps:[{t:"Setup",b:"<strong>Hands</strong> slightly wider than shoulder-width. Body forms a straight line heel to head."},{t:"Brace Core",b:"Engage abs and glutes before descending. <strong>Don't let hips sag</strong> or pike."},{t:"Lower",b:"Lower chest toward floor over <strong>2 seconds</strong>, elbows at 45° from torso."},{t:"Press",b:"<strong>Drive hands</strong> into floor explosively. Fully extend arms at top."}],muscles:"Pecs, Anterior Delt, Triceps"},
{name:"Wide Push-Up",primary:"Pectoralis Major (Outer)",sets:"3",reps:"8-15",rest:"60s",steps:[{t:"Hand Position",b:"Hands placed <strong>1.5× shoulder-width</strong> apart, fingers angled outward 30°."},{t:"Depth",b:"Lower until chest is <strong>1 inch from floor</strong>. Controlled descent."},{t:"Squeeze",b:"Think about <strong>squeezing chest together</strong> at the top rather than pushing away."},{t:"Breathe",b:"<strong>Inhale</strong> on the way down, <strong>exhale</strong> as you press up."}],muscles:"Outer Pecs, Deltoids, Triceps"},
{name:"Diamond Push-Up",primary:"Pectoralis Minor + Triceps",sets:"3",reps:"6-12",rest:"60s",steps:[{t:"Diamond Grip",b:"Form a diamond with <strong>thumbs and index fingers</strong> directly under sternum."},{t:"Elbows In",b:"Keep elbows close to ribs as you lower — <strong>don't let them flare</strong>."},{t:"Range",b:"Lower until nose nearly <strong>touches your hands</strong>. Full range every rep."},{t:"Contract",b:"Squeeze triceps and inner chest <strong>hard at the top lockout</strong>."}],muscles:"Inner Pecs, Triceps, Deltoids"},
{name:"Archer Push-Up",primary:"Unilateral Pectoralis",sets:"3",reps:"6-8 each",rest:"75s",steps:[{t:"Wide Stance",b:"Hands 2× shoulder-width. <strong>One arm fully extended</strong>, one will bend."},{t:"Shift",b:"Shift bodyweight toward the bending arm. Straight arm stays extended."},{t:"Lower",b:"Lower until working elbow hits 90°. Feel the <strong>deep chest stretch</strong>."},{t:"Alternate",b:"Return to centre and shift to the <strong>other side</strong> for equal reps."}],muscles:"Pecs (unilateral), Triceps, Delt"},
{name:"Pike Push-Up",primary:"Upper Chest + Shoulders",sets:"3",reps:"8-12",rest:"60s",steps:[{t:"Pike High",b:"Hips raised, body in inverted V. <strong>Head between arms</strong>."},{t:"Lower",b:"Bend elbows, lower head toward floor <strong>between your hands</strong>."},{t:"Press",b:"Extend arms back to start. Focus on <strong>elbow lockout</strong>."},{t:"Progress",b:"Elevate feet on chair to <strong>increase difficulty</strong>."}],muscles:"Upper Pecs, Anterior Delt, Triceps"}
],
gym:[
{name:"Barbell Bench Press",primary:"Pectoralis Major",sets:"4",reps:"6-10",rest:"2-3min",steps:[{t:"Setup",b:"Lie on bench, feet flat, <strong>slightly outside shoulder-width</strong> grip. Natural back arch."},{t:"Unrack",b:"Bar directly above mid-chest. <strong>Lats squeezed</strong> to protect shoulders."},{t:"Lower",b:"Control bar down to lower chest over 2-3 sec. <strong>Elbows 45-75°</strong> from torso."},{t:"Drive",b:"Press bar up with max force. <strong>Drive legs into floor</strong> as you push."}],muscles:"Pecs, Anterior Delt, Triceps"},
{name:"Dumbbell Chest Fly",primary:"Pectoralis (Stretch)",sets:"3",reps:"10-15",rest:"90s",steps:[{t:"Start",b:"Dumbbells above chest, <strong>slight elbow bend</strong>, palms facing each other."},{t:"Open Arc",b:"Lower arms in wide arc until <strong>deep chest stretch</strong>. Never past parallel."},{t:"Squeeze",b:"Reverse arc back up, <strong>squeeze pecs hard at top</strong>. Dumbbells don't touch."},{t:"Control",b:"Keep weight <strong>moderate</strong> — this is a stretch movement, not a strength move."}],muscles:"Pecs, Anterior Delt"},
{name:"Cable Crossover",primary:"Pectoralis (Full)",sets:"3",reps:"12-15",rest:"60s",steps:[{t:"High Cables",b:"Pulleys at highest position. Stand centred, <strong>one step forward</strong>."},{t:"Pull Down",b:"Pull handles downward and inward in an arc, <strong>crossing hands</strong> at bottom."},{t:"Squeeze",b:"Pause with hands crossed. <strong>Hard 1-second contraction</strong> in inner chest."},{t:"Return",b:"Slowly return to start with <strong>full eccentric control</strong>."}],muscles:"Full Pecs, especially inner fibers"},
{name:"Incline DB Press",primary:"Upper Pectoralis",sets:"4",reps:"8-12",rest:"90s",steps:[{t:"Angle",b:"Bench at <strong>30-45°</strong>. Higher = more shoulder; lower = more upper chest."},{t:"Grip",b:"Dumbbells at shoulder, elbows at <strong>70° from torso</strong>."},{t:"Press",b:"Press up and <strong>slightly inward</strong>, fully extending arms."},{t:"Lower",b:"Control back down 2 sec. <strong>Feel the upper chest stretch</strong>."}],muscles:"Upper Pecs, Anterior Delt, Triceps"},
{name:"Chest Dip",primary:"Lower Pectoralis + Triceps",sets:"3-4",reps:"8-15",rest:"90s",steps:[{t:"Lean Forward",b:"On parallel bars, <strong>lean torso forward 30°</strong> to shift load to chest."},{t:"Descend",b:"Lower until upper arms are <strong>parallel to floor</strong>. Feel chest stretch."},{t:"Drive Up",b:"Push through palms, straighten arms. <strong>Don't aggressively lock out</strong>."},{t:"Overload",b:"When 15 reps is easy, <strong>add a weight belt</strong>."}],muscles:"Lower Pecs, Triceps, Anterior Delt"}
]},
biceps:{
bodyweight:[
{name:"Chin-Up",primary:"Biceps Brachii",sets:"3-4",reps:"6-12",rest:"90s",steps:[{t:"Grip",b:"<strong>Underhand grip</strong>, shoulder-width or narrower. Arms fully extended."},{t:"Dead Hang",b:"Start from full hang, <strong>shoulders packed down</strong>. No swinging."},{t:"Pull",b:"Drive elbows down and back. Lead with <strong>chest toward the bar</strong>."},{t:"Top",b:"Chin clears bar. Hold <strong>1 second</strong>, then lower with full control."}],muscles:"Biceps, Brachialis, Lats"},
{name:"Inverted Row (Supinated)",primary:"Biceps + Mid Back",sets:"3",reps:"10-15",rest:"60s",steps:[{t:"Under Bar",b:"Lie under waist-height bar. <strong>Underhand grip</strong>, body straight."},{t:"Pull",b:"Pull chest to bar, keeping body rigid. <strong>Lead elbows behind you</strong>."},{t:"Squeeze",b:"<strong>Squeeze biceps and back</strong> at the top for 1 second."},{t:"Difficulty",b:"Raise bar to reduce difficulty, lower to <strong>increase challenge</strong>."}],muscles:"Biceps, Rear Delt, Rhomboids"},
{name:"Negative Chin-Up",primary:"Eccentric Biceps",sets:"3",reps:"5-8 slow",rest:"90s",steps:[{t:"Jump Up",b:"Use a chair or jump to get <strong>chin over bar</strong>."},{t:"Lower Slowly",b:"Take <strong>5-8 seconds</strong> to lower yourself to full arm extension."},{t:"Control",b:"Maximum tension in biceps during the <strong>entire descent is the point</strong>."},{t:"Reset",b:"Jump back up. <strong>Never drop</strong> — the slow eccentric is the exercise."}],muscles:"Biceps, Brachialis (eccentric)"},
{name:"Towel Curl",primary:"Biceps (Improvised)",sets:"3",reps:"12-15",rest:"60s",steps:[{t:"Setup",b:"Loop a towel under a heavy stable object. <strong>Hold both ends</strong>."},{t:"Lean Back",b:"Lean back 45°, arms extended, <strong>towel taut throughout</strong>."},{t:"Curl",b:"Curl hands toward shoulders, bringing body upright."},{t:"Lower",b:"Lean back slowly for a <strong>full eccentric</strong>. Control it."}],muscles:"Biceps, Brachioradialis"},
{name:"Doorframe Curl (Isometric)",primary:"Biceps",sets:"3",reps:"30s hold",rest:"45s",steps:[{t:"Grip Frame",b:"Stand in doorway, grip the frame at <strong>elbow height, underhand</strong>."},{t:"Curl",b:"Pull yourself toward the frame as if doing a normal curl."},{t:"Hold",b:"Hold the <strong>maximum contraction position for 30 seconds</strong>."},{t:"Vary",b:"Vary arm angle each set to hit <strong>different portions of the range</strong>."}],muscles:"Biceps, Brachialis"}
],
gym:[
{name:"Barbell Curl",primary:"Biceps Brachii",sets:"4",reps:"8-12",rest:"90s",steps:[{t:"Stance",b:"Stand upright, <strong>underhand shoulder-width grip</strong>. Elbows locked at sides."},{t:"Curl Up",b:"Curl bar to chin. <strong>Supinate wrist at the top</strong> for peak contraction."},{t:"Hold",b:"Peak contraction at top. <strong>1-second pause</strong>."},{t:"Lower",b:"Take <strong>3 seconds to lower</strong>. Don't drop the weight."}],muscles:"Biceps, Brachialis, Brachioradialis"},
{name:"Hammer Curl",primary:"Brachialis + Brachioradialis",sets:"3",reps:"10-14",rest:"75s",steps:[{t:"Neutral Grip",b:"Dumbbells in <strong>neutral grip</strong> (thumbs up, palms face each other)."},{t:"Curl",b:"Curl one dumbbell at a time or both together. <strong>No wrist rotation</strong>."},{t:"Full Range",b:"Full extension to as high as possible <strong>without body sway</strong>."},{t:"Target",b:"Brachialis sits under the bicep — building it <strong>pushes the bicep higher</strong>."}],muscles:"Brachialis, Brachioradialis, Biceps"},
{name:"Cable Curl",primary:"Biceps (Constant Tension)",sets:"3",reps:"12-15",rest:"60s",steps:[{t:"Low Pulley",b:"Straight or EZ bar on <strong>low cable</strong>. Stand close."},{t:"Curl",b:"Curl toward chin, elbows stationary. <strong>Cable stays taut the whole set</strong>."},{t:"Advantage",b:"Cables provide resistance at <strong>full extension</strong> — hits the stretched position."},{t:"Return",b:"Slow <strong>3-second descent</strong>. Feel the stretch at bottom."}],muscles:"Biceps (full range, constant tension)"},
{name:"Incline DB Curl",primary:"Long Head of Biceps",sets:"3",reps:"10-12",rest:"75s",steps:[{t:"Setup",b:"Bench at 45-60°. Arms hang <strong>behind torso</strong> — this stretches the long head."},{t:"Curl",b:"Curl upward without swinging. <strong>The stretched start is the benefit</strong>."},{t:"Supinate",b:"Rotate wrist <strong>outward at top</strong> to peak-contract the long head."},{t:"Why",b:"Long head gives the <strong>bicep peak</strong> — premier exercise for that."}],muscles:"Long Head of Biceps"},
{name:"Preacher Curl",primary:"Short Head of Biceps",sets:"3",reps:"10-12",rest:"75s",steps:[{t:"Position",b:"Arm fully extended on <strong>preacher bench pad</strong>. Back of arm fully contacts pad."},{t:"Curl",b:"Curl up strictly. Don't lean or swing. <strong>Strict form only</strong>."},{t:"Top",b:"Stop just before vertical — going past reduces tension. <strong>Squeeze hard</strong>."},{t:"Lower",b:"Control descent fully. The <strong>bottom stretched position</strong> drives growth."}],muscles:"Short Head of Biceps"}
]},
triceps:{
bodyweight:[
{name:"Diamond Push-Up",primary:"Triceps Brachii",sets:"3-4",reps:"8-15",rest:"60s",steps:[{t:"Form Diamond",b:"Index fingers and thumbs form a diamond <strong>under your sternum</strong>."},{t:"Elbows Back",b:"As you lower, elbows go <strong>back alongside ribcage</strong>, not out."},{t:"Range",b:"Lower until chest lightly contacts hands. <strong>Full range every rep</strong>."},{t:"Lockout",b:"<strong>Fully extend arms at top</strong> — that final inch is the tricep contraction."}],muscles:"All 3 Tricep heads, Inner Pecs"},
{name:"Tricep Dip (Chair)",primary:"Triceps",sets:"3-4",reps:"10-20",rest:"60s",steps:[{t:"Grip",b:"Hands on chair edge, fingers forward. Legs <strong>extended or bent</strong>."},{t:"Lower",b:"Lower until elbows at <strong>90°</strong>. Keep back close to chair edge."},{t:"90° Rule",b:"Stopping at 90° <strong>protects shoulders</strong>. Going deeper adds risk without benefit."},{t:"Press Up",b:"Push through palms, straighten arms. <strong>Squeeze triceps hard</strong> at top."}],muscles:"Triceps (all heads), Anterior Delt"},
{name:"Sphinx Push-Up",primary:"Triceps Long Head",sets:"3",reps:"8-12",rest:"75s",steps:[{t:"Start on Forearms",b:"Begin in <strong>forearm plank</strong>. Elbows under shoulders."},{t:"Push Up",b:"Push through hands, <strong>extending elbows</strong> to full arm extension."},{t:"Lower",b:"Return to forearms slowly. This is an <strong>overhead extension movement</strong>."},{t:"Why",b:"Long head is most active when shoulder is extended — <strong>this nails it</strong>."}],muscles:"Triceps Long Head, Deltoids"},
{name:"Pike Push-Up",primary:"Triceps + Shoulders",sets:"3",reps:"8-12",rest:"60s",steps:[{t:"Pike",b:"Hips raised, inverted V. <strong>Head between arms</strong>."},{t:"Lower",b:"Bend elbows, lower head toward floor. <strong>Elbows angle backward</strong>."},{t:"Press",b:"Extend arms. Focus on <strong>elbow lockout</strong> for tricep activation."},{t:"Progress",b:"Elevate feet for harder version; books under hands for <strong>greater ROM</strong>."}],muscles:"Triceps, Deltoids, Upper Chest"},
{name:"Narrow Plank Hold",primary:"Tricep Isometric",sets:"3",reps:"30-45s",rest:"45s",steps:[{t:"Position",b:"Full push-up plank, hands <strong>directly under shoulders</strong>, close together."},{t:"Slight Bend",b:"Let elbows have a <strong>barely-perceptible 5-10° bend</strong>. This activates triceps isometrically."},{t:"Hold",b:"Hold 30-45 sec. Feel the <strong>burn in the back of arms</strong>."},{t:"Note",b:"Isometric training builds <strong>tendon strength and muscular endurance</strong>."}],muscles:"Triceps Long Head, Core"}
],
gym:[
{name:"Close-Grip Bench Press",primary:"Triceps + Inner Chest",sets:"4",reps:"6-10",rest:"2min",steps:[{t:"Grip",b:"<strong>Shoulder-width grip</strong> — not too narrow. Elbows tuck in at 45°."},{t:"Path",b:"Lower bar to <strong>lower chest</strong>. Elbows at 45° max from torso."},{t:"Drive",b:"Press explosively. Think about <strong>pushing elbows straight</strong>."},{t:"Lockout",b:"<strong>Fully lock out at top</strong> — that's full tricep contraction."}],muscles:"Triceps, Inner Pecs, Deltoids"},
{name:"Overhead Tricep Extension",primary:"Triceps Long Head",sets:"3",reps:"10-14",rest:"75s",steps:[{t:"Setup",b:"One heavy dumbbell held <strong>overhead with both hands</strong>, elbows pointing up."},{t:"Lower",b:"Bend elbows, lower dumbbell behind head. Feel the <strong>deep long-head stretch</strong>."},{t:"Extend",b:"Drive dumbbell overhead, fully extending arms. <strong>Don't swing</strong>."},{t:"Why",b:"Only when shoulder is flexed does the <strong>long head fully stretch and maximally contract</strong>."}],muscles:"Long Head of Triceps"},
{name:"Tricep Pushdown",primary:"Lateral + Medial Heads",sets:"3",reps:"12-16",rest:"60s",steps:[{t:"High Cable",b:"Rope or straight bar on <strong>high pulley</strong>. Elbows locked at sides."},{t:"Push Down",b:"Drive handles down until arms are <strong>fully extended</strong>. Elbows never move."},{t:"Rope Tip",b:"Spread rope ends apart at bottom to <strong>maximally contract the lateral head</strong>."},{t:"Return",b:"Allow handles back up slowly. <strong>Resist the weight on the way up</strong>."}],muscles:"Lateral + Medial Heads of Triceps"},
{name:"Skull Crusher",primary:"Triceps (All Heads)",sets:"3",reps:"10-12",rest:"90s",steps:[{t:"Setup",b:"Lie on bench. EZ-bar held above chest at <strong>full arm extension</strong>."},{t:"Lower",b:"Hinge only at elbows, lower bar toward <strong>forehead or just above</strong>. Elbows stay still."},{t:"Extend",b:"Drive bar back up. <strong>Squeeze hard at full extension</strong>."},{t:"Safety",b:"Keep weight moderate. <strong>A spotter or wrist wraps</strong> are recommended."}],muscles:"All Tricep Heads"},
{name:"Tricep Kickback",primary:"Lateral Head",sets:"3",reps:"12-15",rest:"60s",steps:[{t:"Hinge",b:"Lean forward at hip, back flat. <strong>Upper arm parallel to ground</strong>, elbow 90°."},{t:"Kick Back",b:"Extend forearm back until arm is <strong>fully straight and parallel to floor</strong>."},{t:"Pause",b:"<strong>Hold 1 second</strong> at full extension. Squeeze that lateral head."},{t:"Weight",b:"Use <strong>lighter weight</strong> for strict form — momentum kills this exercise."}],muscles:"Lateral Head of Triceps"}
]},
shoulders:{
bodyweight:[
{name:"Pike Push-Up",primary:"Anterior Deltoid",sets:"3-4",reps:"8-12",rest:"60s",steps:[{t:"Pike High",b:"Get hips as high as possible — more vertical body means <strong>more shoulder load</strong>."},{t:"Head Between",b:"Head passes between arms as you lower, <strong>not outside them</strong>."},{t:"Lower",b:"Lower until <strong>head nearly touches floor</strong>. Elbows go backward."},{t:"Elevate Feet",b:"Feet elevated on a chair = <strong>significantly harder</strong> and more shoulder-dominant."}],muscles:"Anterior Delt, Triceps, Upper Pecs"},
{name:"Handstand Hold (Wall)",primary:"Full Deltoid",sets:"3",reps:"15-30s",rest:"90s",steps:[{t:"Kick Up",b:"Kick feet up to wall. Hands <strong>shoulder-width</strong>, 6 inches from wall."},{t:"Press Tall",b:"<strong>Actively push floor away</strong> — don't just hang. Engaged shoulders."},{t:"Core",b:"Squeeze abs and glutes. <strong>Don't let lower back arch</strong>."},{t:"Hold",b:"Hold 15-30s. Progress toward <strong>freestanding over time</strong>."}],muscles:"Full Deltoid (all 3 heads), Triceps, Core"},
{name:"Lateral Raise (Bottles/Band)",primary:"Medial Deltoid",sets:"3",reps:"12-20",rest:"45s",steps:[{t:"Start",b:"Stand upright, arms at sides with <strong>slight elbow bend</strong>."},{t:"Raise",b:"Lift arms to shoulder height to the sides. <strong>Lead with elbows not hands</strong>."},{t:"Pinky High",b:"Tilt pinky slightly higher than thumb — <strong>better medial delt engagement</strong>."},{t:"Lower Slow",b:"Take <strong>3 seconds to lower</strong>. The eccentric builds strength."}],muscles:"Medial Deltoid, Supraspinatus"},
{name:"Prone Y-T-W Raise",primary:"Posterior Delt + Rotator Cuff",sets:"3",reps:"10-12 each",rest:"45s",steps:[{t:"Lie Prone",b:"Face down, arms overhead in a <strong>Y shape</strong>. Lift arms."},{t:"T Shape",b:"Move arms to sides — <strong>T shape</strong>. Hold 1 second."},{t:"W Shape",b:"Bend elbows, pull toward head — <strong>W shape</strong>. Squeeze shoulder blades."},{t:"Why",b:"Bulletproofs the <strong>rotator cuff and rear delt</strong> — most neglected muscles."}],muscles:"Posterior Delt, Rotator Cuff, Rhomboids"},
{name:"Band Pull-Apart",primary:"Posterior Delt",sets:"3-4",reps:"15-25",rest:"30s",steps:[{t:"Hold Band",b:"Resistance band at arm's length, <strong>overhand grip shoulder-width</strong>."},{t:"Pull Apart",b:"Pull band until it touches chest. <strong>Squeeze shoulder blades together</strong>."},{t:"Control",b:"Return slowly to start. <strong>Don't let elbows bend</strong> during the movement."},{t:"Bands",b:"Use a <strong>light band</strong> — form degrades fast with heavy tension here."}],muscles:"Posterior Delt, Rhomboids, Rear Delt"}
],
gym:[
{name:"Overhead Barbell Press",primary:"Anterior + Medial Delt",sets:"4",reps:"6-10",rest:"2min",steps:[{t:"Grip",b:"Slightly outside shoulder-width. Bar rests on <strong>upper chest/front delts</strong>."},{t:"Press",b:"Press bar straight up. As it passes your forehead, <strong>push head slightly forward</strong>."},{t:"Lockout",b:"Arms fully extended overhead. <strong>Bar should be over your ears</strong>, not in front."},{t:"Core",b:"<strong>Squeeze abs hard</strong> — prevents lower back arch under heavy load."}],muscles:"Anterior + Medial Delt, Triceps, Upper Traps"},
{name:"DB Lateral Raise",primary:"Medial Deltoid",sets:"4",reps:"12-20",rest:"60s",steps:[{t:"Slight Lean",b:"Lean torso forward <strong>10-15°</strong> — shifts load to medial delt."},{t:"Lead Elbows",b:"Raise elbows to shoulder height. <strong>Lead with elbows, not hands</strong>."},{t:"Pinky High",b:"Internally rotate slightly — <strong>pinky higher than thumb at the top</strong>."},{t:"Cheat Reps",b:"Slight momentum on last 2-3 reps to go <strong>beyond failure safely</strong>."}],muscles:"Medial Deltoid"},
{name:"Rear Delt Fly",primary:"Posterior Deltoid",sets:"3",reps:"12-15",rest:"60s",steps:[{t:"Hinge",b:"Bend at hip, torso <strong>roughly parallel to floor</strong>. Arms hanging."},{t:"Fly Out",b:"Raise arms to sides, leading with elbows. <strong>Slight elbow bend</strong>."},{t:"Squeeze",b:"Squeeze shoulder blades at top. <strong>Light weight, strict form</strong>."},{t:"Cable Option",b:"Cables maintain <strong>constant tension</strong> — superior to dumbbells here."}],muscles:"Posterior Delt, Rhomboids, Teres Minor"},
{name:"Arnold Press",primary:"All 3 Deltoid Heads",sets:"3",reps:"10-12",rest:"75s",steps:[{t:"Start",b:"Dumbbells at chin, <strong>palms facing you</strong> (reverse curl position)."},{t:"Rotate Out",b:"As you press, <strong>rotate palms forward</strong> to traditional press grip."},{t:"Press",b:"Complete full overhead press. Rotate back on the way down. <strong>The rotation is the magic</strong>."},{t:"Why",b:"Rotation fires all 3 delt heads at <strong>different phases of the movement</strong>."}],muscles:"All 3 Deltoid Heads"},
{name:"Face Pull",primary:"Rear Delt + Rotator Cuff",sets:"3",reps:"15-20",rest:"60s",steps:[{t:"Height",b:"Set cable to <strong>face height or slightly above</strong>. Rope attachment."},{t:"Pull to Face",b:"Pull rope toward face, <strong>elbows flaring out and back</strong>."},{t:"External Rotate",b:"At end, externally rotate so hands end <strong>beside ears, pointing up</strong>. Pause 1 sec."},{t:"Why",b:"<strong>Essential for shoulder health</strong> — counteracts all the internal rotation from pressing."}],muscles:"Posterior Delt, External Rotators, Rhomboids"}
]},
back:{
bodyweight:[
{name:"Pull-Up (Overhand)",primary:"Latissimus Dorsi",sets:"3-4",reps:"5-12",rest:"90s",steps:[{t:"Dead Hang",b:"Full extension, shoulder-width <strong>overhand grip</strong>. Pack shoulder blades down."},{t:"Initiate with Back",b:"Think 'pull elbows to hips' not 'pull hands to chin.' <strong>Lats fire first</strong>."},{t:"Rise",b:"Rise until chin clears bar. Chest slightly <strong>angled toward bar</strong>."},{t:"Lower",b:"Lower over 2-3 sec back to dead hang. <strong>Full range every rep</strong>."}],muscles:"Lats, Biceps, Rhomboids, Lower Traps"},
{name:"Inverted Row",primary:"Mid Back + Lats",sets:"3-4",reps:"8-15",rest:"75s",steps:[{t:"Under Bar",b:"Lie under a bar or table. <strong>Overhand grip</strong>, body straight heel to head."},{t:"Row Up",b:"Pull chest to bar, elbows drive <strong>toward hips</strong>. Squeeze shoulder blades at top."},{t:"Difficulty",b:"More horizontal body = <strong>harder</strong>. Bend knees to reduce difficulty."},{t:"Pause",b:"Hold top position 1 sec to <strong>eliminate momentum</strong>."}],muscles:"Mid Back, Rhomboids, Rear Delt, Biceps"},
{name:"Superman Hold",primary:"Erector Spinae",sets:"3-4",reps:"10-15 or 30s",rest:"60s",steps:[{t:"Prone",b:"Lie face down, arms extended overhead. <strong>Squeeze glutes first</strong>."},{t:"Lift",b:"Raise arms AND legs simultaneously. <strong>No jerking</strong> — smooth movement."},{t:"Hold",b:"Hold 2-3 sec at top. Feel <strong>entire posterior chain engaged</strong>."},{t:"Lower",b:"Lower gently — don't drop. Repeat for reps or <strong>hold for time</strong>."}],muscles:"Erector Spinae, Glutes, Posterior Delt"},
{name:"Archer Row (Towel)",primary:"Unilateral Lats",sets:"3",reps:"8-12 per side",rest:"60s",steps:[{t:"Single Arm",b:"Towel looped around a pole. <strong>One hand only</strong>, other behind back."},{t:"Row",b:"Row body toward the pole with single-arm motion."},{t:"Squeeze",b:"<strong>Squeeze lat hard at end range</strong>. Think 'tuck elbow into hip pocket.'"},{t:"Lower",b:"Extend back slowly. <strong>Greater ROM</strong> than two-arm version."}],muscles:"Lats (unilateral), Biceps, Rhomboids"},
{name:"Good Morning (BW)",primary:"Spinal Erectors",sets:"3",reps:"12-15",rest:"30s",steps:[{t:"Stand",b:"Hands behind head, feet hip-width. <strong>Slight knee bend</strong>."},{t:"Hinge",b:"Push hips back, tilting torso forward until <strong>parallel to floor</strong>."},{t:"Extend",b:"Return by contracting <strong>lower back and glutes</strong> — not momentum."},{t:"Why",b:"Activates and strengthens erectors, improving <strong>posture and spinal stability</strong>."}],muscles:"Erector Spinae, Hamstrings, Glutes"}
],
gym:[
{name:"Deadlift",primary:"Full Posterior Chain",sets:"4",reps:"4-8",rest:"3min",steps:[{t:"Setup",b:"Bar over mid-foot. Hip-width stance. <strong>Hinge at hips</strong>, grab bar overhand."},{t:"Tension",b:"Take slack out of bar. <strong>Chest up, lats engaged</strong> — imagine protecting armpits."},{t:"Drive",b:"Push floor away. Bar stays <strong>dragging up shins</strong>. Hips and shoulders rise together."},{t:"Lockout",b:"Stand fully upright. <strong>Don't hyperextend</strong> the lower back at the top."}],muscles:"Entire Posterior Chain, Lats, Traps, Glutes, Hamstrings"},
{name:"Barbell Row",primary:"Lats + Mid Back",sets:"4",reps:"8-10",rest:"90s",steps:[{t:"Hinge",b:"Torso <strong>roughly 45° from floor</strong>. Overhand grip just outside shoulder-width."},{t:"Row to Hip",b:"Pull bar toward <strong>lower abs/hips</strong> — NOT chest. Elbows brush ribs."},{t:"Squeeze",b:"At contact, <strong>squeeze shoulder blades hard</strong>. 1-second pause."},{t:"Lower",b:"Return bar to full extension over <strong>2-3 seconds</strong>."}],muscles:"Lats, Rhomboids, Lower Traps, Biceps"},
{name:"Seated Cable Row",primary:"Mid Back + Lats",sets:"3",reps:"10-14",rest:"75s",steps:[{t:"Setup",b:"Sit upright, <strong>close-grip V-bar</strong> attachment. Feet on platforms."},{t:"Row",b:"Pull handle to lower abdomen. Elbows drive <strong>behind your torso</strong>."},{t:"Retract",b:"<strong>Squeeze shoulder blades together</strong> at peak. Chest stays tall."},{t:"Return",b:"Allow shoulder blades to protract fully — <strong>full stretch on the way back</strong>."}],muscles:"Mid Back, Lats, Biceps, Rear Delt"},
{name:"Single-Arm DB Row",primary:"Unilateral Lats",sets:"3",reps:"10-14 per side",rest:"75s",steps:[{t:"Brace",b:"Knee and hand on bench. <strong>Back flat and parallel to floor</strong>."},{t:"Pull to Hip",b:"Row dumbbell to hip — NOT shoulder. Feel the <strong>lat doing the work</strong>."},{t:"Elbow Path",b:"Lead with elbow. At top, elbow should be <strong>above your back</strong>."},{t:"Stretch",b:"Let shoulder protract at bottom for a <strong>full lat stretch each rep</strong>."}],muscles:"Lats, Rhomboids, Biceps, Rear Delt"},
{name:"Lat Pulldown",primary:"Latissimus Dorsi",sets:"3-4",reps:"10-14",rest:"75s",steps:[{t:"Lean Back",b:"Slight torso lean (10-15°). <strong>Wide overhand grip</strong>."},{t:"Pull to Chest",b:"Pull bar to <strong>upper chest</strong>. Lead with elbows toward hips."},{t:"Chest Forward",b:"Push chest <strong>forward and up</strong> to meet the bar — activates lats fully."},{t:"Return",b:"Let bar rise slowly, feeling the <strong>full lat stretch overhead</strong>."}],muscles:"Lats, Biceps, Lower/Mid Traps"}
]},
abs:{
bodyweight:[
{name:"Hollow Body Hold",primary:"Transverse Abdominis",sets:"3-4",reps:"20-45s",rest:"45s",steps:[{t:"Lie Flat",b:"On back, arms and legs extended. <strong>Press lower back into floor</strong> — this is key."},{t:"Raise",b:"Raise arms, head, shoulders, feet <strong>3-6 inches off floor</strong>. Body forms a slight banana curve."},{t:"Hold",b:"Hold without lower back arching. <strong>Breathe shallow but consistently</strong>."},{t:"Why",b:"Builds <strong>foundational tension</strong> used in all calisthenics — rings, bar, handstand."}],muscles:"Transverse Abs, Rectus Abdominis, Hip Flexors"},
{name:"Plank",primary:"Core (Full)",sets:"3",reps:"30-90s",rest:"45s",steps:[{t:"Setup",b:"Forearms on floor. <strong>Elbows directly under shoulders</strong>."},{t:"Brace",b:"Squeeze abs as if bracing for a punch. <strong>Also squeeze glutes and quads</strong>."},{t:"Level Hips",b:"Don't let hips sag or pike. <strong>Straight line crown to heels</strong>."},{t:"Breathe",b:"Maintain normal breathing. <strong>Don't hold breath</strong>."}],muscles:"Transverse Abs, Obliques, Erectors, Glutes"},
{name:"Bicycle Crunch",primary:"Rectus Abdominis + Obliques",sets:"3",reps:"15-20 per side",rest:"45s",steps:[{t:"Back Down",b:"Lie on back, lower back pressed to floor. <strong>Hands lightly behind head</strong>, elbows wide."},{t:"Pedal",b:"Bring right knee to chest while left leg extends. <strong>Rotate left elbow toward right knee</strong>."},{t:"Rotation",b:"Rotation comes from <strong>obliques contracting</strong> — not from pulling the neck."},{t:"Slow",b:"Slow controlled reps beat fast sloppy ones. <strong>2 seconds each direction</strong>."}],muscles:"Obliques, Rectus Abdominis, Hip Flexors"},
{name:"Hanging Knee Raise",primary:"Lower Abs",sets:"3",reps:"10-15",rest:"60s",steps:[{t:"Hang",b:"Full hang from pull-up bar. <strong>Shoulders packed. Don't swing</strong>."},{t:"Raise Knees",b:"Bring knees to chest by contracting <strong>lower abs first</strong>, then hip flexors."},{t:"No Swing",b:"Control the movement. <strong>Stop and restart</strong> if you start swinging."},{t:"Progress",b:"Straighten legs for <strong>hanging leg raise</strong> — significantly harder."}],muscles:"Lower Rectus Abdominis, Hip Flexors, Obliques"},
{name:"Russian Twist",primary:"Obliques",sets:"3",reps:"15-20 per side",rest:"45s",steps:[{t:"Sit Up",b:"Sit, knees bent, heels elevated 2 inches. <strong>Torso leaned back 30-45°</strong>."},{t:"Rotate",b:"Rotate torso left and right, touching floor beside hip each side. <strong>Control the rotation</strong>."},{t:"Arms Extended",b:"Keep arms extended in front — <strong>harder</strong>. Hold a weight for added resistance."},{t:"Breathe",b:"<strong>Exhale as you rotate</strong>, inhale at centre."}],muscles:"External + Internal Obliques, Transverse Abs"}
],
gym:[
{name:"Cable Crunch",primary:"Rectus Abdominis",sets:"3-4",reps:"12-20",rest:"60s",steps:[{t:"Kneel",b:"Kneel below high pulley, rope held by each side of head."},{t:"Crunch Down",b:"Round spine, pulling <strong>elbows toward knees</strong>. Hips stay stationary."},{t:"Peak Contract",b:"At bottom, <strong>squeeze abs hard for 1 second</strong>."},{t:"Note",b:"Resistance through full ROM — <strong>superior to crunches</strong> for building size."}],muscles:"Rectus Abdominis (upper + lower)"},
{name:"Ab Rollout",primary:"Transverse + Rectus Abs",sets:"3",reps:"8-12",rest:"75s",steps:[{t:"Kneel",b:"Kneel on pad with ab wheel. <strong>Arms straight</strong>."},{t:"Roll Out",b:"Roll wheel forward, hips descend. <strong>Maintain core tension throughout</strong>."},{t:"Stop",b:"Stop before you'd collapse. <strong>Hold 1 second</strong> at full extension."},{t:"Return",b:"Contract abs hard to pull wheel back. <strong>Don't use hip flexors</strong>."}],muscles:"Transverse Abs, Rectus Abdominis, Lats"},
{name:"Pallof Press",primary:"Anti-Rotation Core",sets:"3",reps:"12-15 per side",rest:"60s",steps:[{t:"Setup",b:"Stand sideways to cable. Handle at <strong>chest height</strong>."},{t:"Press Out",b:"Press handle straight out from chest. <strong>Resist cable pulling you sideways</strong>."},{t:"Hold",b:"Fully extended arms — hold <strong>1-2 seconds</strong>. This is the hard part."},{t:"Return",b:"Bring handle back. The <strong>anti-rotation demand is where the core works</strong>."}],muscles:"Obliques, Transverse Abs, Glutes"},
{name:"Decline Crunch",primary:"Upper Abs",sets:"3",reps:"15-20",rest:"60s",steps:[{t:"Setup",b:"Hook feet on decline bench at 30-45°. <strong>Arms crossed or hands behind head</strong>."},{t:"Crunch",b:"Curl shoulders toward knees. <strong>Lead with upper ab contraction, not hip flexors</strong>."},{t:"Top Hold",b:"Hold 1 second. <strong>Squeeze hard</strong>."},{t:"Lower",b:"Stop <strong>just before shoulders touch bench</strong> — maintain tension."}],muscles:"Upper Rectus Abdominis"},
{name:"Landmine Twist",primary:"Obliques (Power)",sets:"3",reps:"10-12 per side",rest:"75s",steps:[{t:"Setup",b:"Hold end of loaded barbell in corner. <strong>Squat stance</strong>, both hands on bar."},{t:"Arc",b:"Swing bar in an arc from one hip to other. <strong>Rotate from torso, not arms</strong>."},{t:"Control",b:"No momentum — each direction is <strong>deliberate and controlled</strong>."},{t:"Power",b:"Builds <strong>rotational power</strong> for boxing, golf, martial arts, throwing."}],muscles:"External/Internal Obliques, Serratus, Core"}
]},
quads:{
bodyweight:[
{name:"Bodyweight Squat",primary:"Quadriceps",sets:"4",reps:"15-25",rest:"45s",steps:[{t:"Stance",b:"Feet shoulder-width, toes out 15-30°. <strong>Weight through whole foot</strong>."},{t:"Squat",b:"Push hips back and bend knees. <strong>Knees track over toes</strong>, don't cave."},{t:"Depth",b:"Thighs <strong>parallel or below parallel</strong> to floor."},{t:"Drive",b:"Push through full foot to stand. <strong>Squeeze glutes at top</strong>."}],muscles:"Quads, Glutes, Hamstrings, Core"},
{name:"Bulgarian Split Squat",primary:"Quads + Glutes (Unilateral)",sets:"3",reps:"8-12 per leg",rest:"90s",steps:[{t:"Setup",b:"Rear foot elevated on bench. Front foot <strong>far enough forward</strong> for vertical shin."},{t:"Lower",b:"Drop back knee toward floor. <strong>Front knee stays over toes</strong>."},{t:"Drive",b:"Press through the <strong>heel of front foot</strong> to stand."},{t:"Balance",b:"Move front foot further forward if unstable. <strong>Core tight throughout</strong>."}],muscles:"Quads, Glutes, Hip Flexors, Hamstrings"},
{name:"Wall Sit",primary:"Quads (Isometric)",sets:"3-4",reps:"30-90s",rest:"60s",steps:[{t:"Position",b:"Back flat against wall. Slide down until thighs are <strong>parallel to floor</strong>."},{t:"Feet",b:"Flat on floor, hip-width, <strong>directly below knees</strong>."},{t:"Hold",b:"Hold as long as possible. <strong>Don't push off thighs</strong> with hands."},{t:"Breathe",b:"Breathe normally. The <strong>quad burn is normal</strong> — push through it."}],muscles:"Quads (Isometric), Glutes"},
{name:"Jump Squat",primary:"Quads + Power",sets:"3-4",reps:"10-15",rest:"90s",steps:[{t:"Squat",b:"Full squat position, <strong>arms back</strong>."},{t:"Explode",b:"Drive up explosively, swing arms forward. <strong>Leave the ground</strong>."},{t:"Land Soft",b:"Land with soft knees, absorbing impact. <strong>Go straight into next squat</strong>."},{t:"Power",b:"Builds <strong>explosive quad strength</strong> and improves athletic performance."}],muscles:"Quads, Glutes, Calves (explosive)"},
{name:"Step-Up",primary:"Quads + Glutes",sets:"3",reps:"12-15 per leg",rest:"60s",steps:[{t:"Find Box",b:"Step or box at knee height. Place <strong>one full foot on top</strong>."},{t:"Drive Up",b:"Press through elevated foot's <strong>heel to step up</strong>. Don't push off back foot."},{t:"Lower",b:"Lower back foot slowly — <strong>2-3 second eccentric</strong>. Don't drop."},{t:"Height",b:"Higher box = more glute. Lower box = more quad. <strong>Adjust to target</strong>."}],muscles:"Quads, Glutes, Hamstrings"}
],
gym:[
{name:"Barbell Back Squat",primary:"Quadriceps (Full)",sets:"4",reps:"5-8",rest:"3min",steps:[{t:"Bar Position",b:"Bar on upper traps (high bar) or rear delts (low bar). <strong>Shoulder-width grip</strong>."},{t:"Brace",b:"Big breath into belly. <strong>Brace core hard</strong>. Hold through the rep."},{t:"Descent",b:"Push hips back and down. Knees track toes. <strong>Below parallel for full quad activation</strong>."},{t:"Drive Up",b:"Drive floor away. <strong>Chest up as you rise</strong> — don't let hips shoot up first."}],muscles:"Quads, Glutes, Hamstrings, Erectors"},
{name:"Leg Press",primary:"Quads + Glutes",sets:"4",reps:"10-15",rest:"90s",steps:[{t:"Foot Position",b:"Feet hip-width, middle of platform. <strong>Higher = more glute; lower = more quad</strong>."},{t:"Range",b:"Lower until knees reach <strong>90° or just below</strong>. Don't let lower back round."},{t:"Press",b:"Drive platform away without <strong>fully locking knees</strong> at the top."},{t:"Load",b:"Allows <strong>high volume with heavy weight</strong> — excellent for quad mass."}],muscles:"Quads, Glutes, Hamstrings"},
{name:"Hack Squat",primary:"Quads (Sweep + Teardrop)",sets:"3-4",reps:"8-12",rest:"90s",steps:[{t:"Narrow Stance",b:"Feet narrow and low on platform. <strong>Maximizes quad sweep activation</strong>."},{t:"Depth",b:"Go as deep as flexibility allows — ideally <strong>below parallel</strong>."},{t:"Focus",b:"Machine removes spinal load — <strong>fully concentrate on quad contraction</strong>."},{t:"Pause",b:"<strong>Pause at bottom for 1 second</strong> — eliminates momentum."}],muscles:"Quads (VMO, sweep), Glutes"},

{name:"Fingertip Push-Up",primary:"Forearms + Finger Tendons",sets:"3",reps:"6-12",rest:"75s",steps:[{t:"Setup",b:"Standard push-up but only <strong>fingertips contact the floor</strong>."},{t:"Controlled",b:"Slow controlled movement. <strong>No bouncing</strong> — this stresses tendons."},{t:"Warning",b:"Build up gradually over <strong>weeks/months</strong>. Tendons heal slowly."},{t:"Benefits",b:"Builds <strong>exceptional finger and forearm strength</strong> for climbing, martial arts."}],muscles:"Forearm Flexors, Finger Tendons, Hand Intrinsics"},
{name:"Plate Pinch Hold",primary:"Pinch Grip",sets:"3",reps:"30-45s",rest:"60s",steps:[{t:"Plate",b:"Hold a weight plate pinched between <strong>thumb and four fingers</strong>, not palm."},{t:"Hold",b:"Hold at side for max time. <strong>Smooth surface is harder</strong>."},{t:"Two Plates",b:"Pinch <strong>two plates back-to-back</strong> (smooth sides out) for added challenge."},{t:"Why",b:"Pinch grip is the <strong>weakest pattern for most people</strong> — highly effective training."}],muscles:"Thumb Muscles, Forearm Flexors"}
],
gym:[
{name:"Barbell Wrist Curl",primary:"Forearm Flexors",sets:"3-4",reps:"12-20",rest:"45s",steps:[{t:"Setup",b:"Sit, forearms on thighs, <strong>wrists hanging off knees</strong>. Underhand grip."},{t:"Curl Up",b:"Curl wrists upward, contracting <strong>forearm flexors fully</strong>."},{t:"Lower",b:"Lower wrists fully — let <strong>bar roll to fingertips</strong> for full stretch."},{t:"Feel",b:"Deep burn in the <strong>forearm belly</strong> — that's correct."}],muscles:"Flexor Carpi Radialis/Ulnaris, Flexor Digitorum"},
{name:"Reverse Wrist Curl",primary:"Forearm Extensors",sets:"3",reps:"12-20",rest:"45s",steps:[{t:"Overhand Grip",b:"Forearms on thighs, <strong>overhand grip</strong> (knuckles up)."},{t:"Extend Wrists",b:"Extend wrists upward, contracting <strong>top side of forearm</strong>."},{t:"Lower",b:"Wrists drop back fully — <strong>balanced development prevents injury</strong>."},{t:"Balance",b:"Most only train flexors. <strong>Extensors are equally important</strong> for elbow health."}],muscles:"Extensor Carpi Radialis/Ulnaris, Brachioradialis"},
{name:"Reverse Curl",primary:"Brachioradialis + Extensors",sets:"3",reps:"10-15",rest:"60s",steps:[{t:"Overhand Grip",b:"Standard curl position with <strong>overhand (pronated) grip</strong>."},{t:"Curl Up",b:"Curl bar toward chin. <strong>Brachioradialis does most work here</strong>."},{t:"Strict Form",b:"<strong>Very strict form required</strong> — much harder than regular curl."},{t:"Why",b:"Brachioradialis = the large muscle on <strong>outer forearm</strong>. This targets it directly."}],muscles:"Brachioradialis, Extensor Carpi, Biceps"},
{name:"Farmer's Carry",primary:"Full Forearm + Grip",sets:"4",reps:"40 meters",rest:"90s",steps:[{t:"Heavy",b:"<strong>Heaviest dumbbells</strong> or farmer handles available."},{t:"Walk",b:"Controlled steps. Keep shoulders <strong>back, chest up</strong>."},{t:"Don't Switch",b:"<strong>Walk until grip fails</strong> — don't put down early."},{t:"Best",b:"Farmer's carry may be the single <strong>most effective grip and forearm exercise</strong>."}],muscles:"Entire Forearm, Grip, Traps, Core"},

<text class="muscle-label" x="134" y="76" text-anchor="middle">TRAP</text><line class="label-line" x1="134" y1="78" x2="138" y2="88"/>
</svg>`;

// ── STATE ──────────────────────────────────────────────────
let selectedMuscles=new Set(),currentGender='male',currentView='front',currentExType='bodyweight';

// ── RENDER SVG ─────────────────────────────────────────────
function renderSVG(){
  const c=document.getElementById('svgContainer');
  if(currentView==='front') c.innerHTML=currentGender==='male'?FRONT_MALE:FRONT_FEMALE;
  else c.innerHTML=BACK_SVG;
  document.querySelectorAll('.muscle-group').forEach(el=>{
    const m=el.dataset.muscle;
    el.addEventListener('click',()=>toggleMuscle(m));
    el.addEventListener('mouseenter',e=>showTip(e,MUSCLE_NAMES[m]||m));
    el.addEventListener('mousemove',e=>moveTip(e));
    el.addEventListener('mouseleave',hideTip);
  });
  selectedMuscles.forEach(m=>{
    document.querySelectorAll(`[data-muscle="${m}"]`).forEach(el=>el.classList.add('selected'));
  });
}

// ── TOGGLE ─────────────────────────────────────────────────
function toggleMuscle(m){
  if(selectedMuscles.has(m)){
    selectedMuscles.delete(m);
    document.querySelectorAll(`[data-muscle="${m}"]`).forEach(el=>el.classList.remove('selected'));
  }else{
    selectedMuscles.add(m);
    document.querySelectorAll(`[data-muscle="${m}"]`).forEach(el=>el.classList.add('selected'));
  }
  updateTags();renderExercises();
}

function updateTags(){
  const a=document.getElementById('tagsArea');
  a.innerHTML='';
  selectedMuscles.forEach(m=>{
    const d=document.createElement('div');
    d.className='tag';
    d.innerHTML=`${MUSCLE_NAMES[m]||m} <button onclick="toggleMuscle('${m}')">&#215;</button>`;
    a.appendChild(d);
  });
  const n=selectedMuscles.size;
  document.getElementById('selCount').textContent=n+' MUSCLE'+(n!==1?'S':'');
}

function clearAll(){
  selectedMuscles.clear();
  document.querySelectorAll('.muscle-group').forEach(el=>el.classList.remove('selected'));
  updateTags();renderExercises();
}

// ── GENDER / VIEW / TYPE ───────────────────────────────────
function setGender(g){
  currentGender=g;
  document.getElementById('btnMale').className='gender-btn'+(g==='male'?' am':'');
  document.getElementById('btnFemale').className='gender-btn'+(g==='female'?' af':'');
  renderSVG();
}
function setView(v){
  currentView=v;
  document.getElementById('btnFront').className='view-btn'+(v==='front'?' active':'');
  document.getElementById('btnBack').className='view-btn'+(v==='back'?' active':'');
  renderSVG();
}
function setExType(t){
  currentExType=t;
  document.getElementById('bwBtn').className='ex-type-btn'+(t==='bodyweight'?' active':'');
  document.getElementById('gymBtn').className='ex-type-btn'+(t==='gym'?' active':'');
  renderExercises();
}

// ── RENDER EXERCISES ───────────────────────────────────────
function renderExercises(){
  const empty=document.getElementById('emptyState');
  const content=document.getElementById('exerciseContent');
  const cards=document.getElementById('exerciseCards');
  if(selectedMuscles.size===0){empty.style.display='flex';content.style.display='none';return;}
  empty.style.display='none';content.style.display='block';
  let all=[];
  selectedMuscles.forEach(m=>{
    const list=EX[m]&&EX[m][currentExType];
    if(list)all.push(...list);
  });
  const seen=new Set();
  all=all.filter(e=>{if(seen.has(e.name))return false;seen.add(e.name);return true;});
  const muscleList=[...selectedMuscles].map(m=>MUSCLE_NAMES[m]).join(' + ');
  const shortList=muscleList.length>38?muscleList.substring(0,38)+'…':muscleList;
  document.getElementById('exTitle').innerHTML=`${shortList} <span style="font-size:0.62rem;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:400">EXERCISES</span>`;
  cards.innerHTML='';
  all.slice(0,6).forEach((ex,i)=>{
    const card=buildCard(ex,i);
    card.style.animationDelay=(i*0.06)+'s';
    cards.appendChild(card);
  });
}

function buildCard(ex,i){
  const div=document.createElement('div');
  div.className='ex-card';
  const badge=currentExType==='bodyweight'
    ?`<span class="ex-badge badge-bw">BODYWEIGHT</span>`
    :`<span class="ex-badge badge-gym">GYM</span>`;
  div.innerHTML=`
    <div class="ex-card-header" onclick="toggleCard(this.parentElement)">
      <div class="ex-num">0${i+1}</div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">${badge}<span class="ex-badge badge-primary">${ex.primary}</span></div>
      </div>
      <span class="ex-chevron">&#9662;</span>
    </div>
    <div class="ex-detail">
      <div class="ex-detail-inner">
        <div class="sets-row">
          <div class="sets-item"><div class="sets-label">Sets</div><div class="sets-val">${ex.sets}</div></div>
          <div class="sets-item"><div class="sets-label">Reps</div><div class="sets-val">${ex.reps}</div></div>
          <div class="sets-item"><div class="sets-label">Rest</div><div class="sets-val">${ex.rest}</div></div>
        </div>
        <div class="steps-grid">
          ${ex.steps.map((s,si)=>`
            <div class="step-card">
              <div class="step-num">STEP ${si+1} — ${s.t.toUpperCase()}</div>
              <div class="step-text">${s.b}</div>
            </div>`).join('')}
        </div>
        <div class="muscles-hit">Muscles engaged: <span>${ex.muscles}</span></div>
      </div>
    </div>`;
  return div;
}

function toggleCard(card){
  if(card.classList.contains('open')){
    card.classList.remove('open');
  }else{
    document.querySelectorAll('.ex-card.open').forEach(c=>c.classList.remove('open'));
    card.classList.add('open');
    setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),80);
  }
}

// ── TOOLTIP ───────────────────────────────────────────────
const tip=document.getElementById('tooltip');
function showTip(e,txt){tip.textContent=txt;tip.style.opacity='1';moveTip(e);}
function moveTip(e){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-34)+'px';}
function hideTip(){tip.style.opacity='0';}

// ── INIT ──────────────────────────────────────────────────
renderSVG();
</script>
</body>
</html>
